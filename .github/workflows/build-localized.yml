name: build localized image

# Builds the zh/en-localized dashboard as a container image and publishes it to
# ghcr.io. This is the artifact the self-hosted deployment pulls.
#
# Triggered by:
#   * a push to i18n-zh        (the sync workflow's merge lands here)
#   * a version tag            (cut a release of the localized dashboard)
#   * manual dispatch
#
# Kept separate from `sync-upstream.yml` on purpose: syncing is about source
# history, publishing is about a deployable artifact, and a failed image build
# should not block the next sync.

on:
  push:
    branches: ["i18n-zh"]
    tags: ["i18n-v*"]
  workflow_dispatch:

concurrency:
  group: build-localized-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: |
          echo '{}' > .local-config.json
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Download IronRDP release artifacts
        uses: robinraju/release-downloader@v1.13
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          tag: v0.0.2
          fileName: "*.ts"
          out-file-path: "public/ironrdp-pkg"

      - name: Download IronRDP js
        uses: robinraju/release-downloader@v1.13
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          tag: v0.0.2
          fileName: "*.js"
          out-file-path: "public/ironrdp-pkg"

      - name: Download IronRDP wasm
        uses: robinraju/release-downloader@v1.13
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          tag: v0.0.2
          fileName: "ironrdp_web_bg.wasm"
          out-file-path: "public/ironrdp-pkg"

      - name: Verify the zh catalog is present
        run: |
          set -euo pipefail
          test -s src/i18n/messages/zh.ts
          # Fail loudly if the merge ever drops the catalog.
          grep -q "export default" src/i18n/messages/zh.ts
          echo "zh.ts lines: $(wc -l < src/i18n/messages/zh.ts)"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_DASHBOARD_VERSION: ${{ github.ref_name }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=zh-latest,enable=${{ github.ref == 'refs/heads/i18n-zh' }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summarize
        run: |
          {
            echo '### Localized dashboard image'
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo
            echo "zh catalog: $(wc -l < src/i18n/messages/zh.ts) lines"
          } >> "$GITHUB_STEP_SUMMARY"
